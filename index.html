<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini App для парочек</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
body { font-family: sans-serif; padding: 16px; }
input, button { padding: 8px; font-size: 16px; margin: 4px 0; }
</style>
</head>
<body>

<h2>Введи свой ник</h2>
<input id="selfName" placeholder="Твой ник">
<button id="saveSelf">Сохранить</button>

<h2>Пригласи партнера</h2>
<button id="copyLink">Скопировать ссылку</button>

<h2>Ник партнера</h2>
<div id="partnerNameDiv">Ждём партнера...</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();

// ====== Firebase ======
const firebaseConfig = {
  apiKey: "AIzaSyCXxIQD1aNxBvauiY65MMNWuwuXQYeKUn8",
  authDomain: "mini-app-forcouples.firebaseapp.com",
  databaseURL: "https://mini-app-forcouples-default-rtdb.firebaseio.com",
  projectId: "mini-app-forcouples",
  storageBucket: "mini-app-forcouples.firebasestorage.app",
  messagingSenderId: "597378655994",
  appId: "1:597378655994:web:82c08f4e0a81a6894ecb43",
  measurementId: "G-6DM9GWM2QR"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ====== Пара ======
const urlParams = new URLSearchParams(window.location.search);
let pairCode = urlParams.get('pair') || Math.random().toString(36).substr(2, 6);

// Сохраняем свой ник
document.getElementById('saveSelf').addEventListener('click', () => {
  const self = document.getElementById('selfName').value.trim();
  if (!self) return alert('Введите ник!');
  db.ref('pairs/' + pairCode + '/selfName').set(self);
});

// Копируем ссылку для партнера
document.getElementById('copyLink').addEventListener('click', () => {
  const link = window.location.origin + window.location.pathname + '?pair=' + pairCode;
  navigator.clipboard.writeText(link);
  alert('Ссылка скопирована: ' + link);
});

// Слушаем изменения пары
db.ref('pairs/' + pairCode).on('value', snapshot => {
  const data = snapshot.val() || {};
  const partnerDiv = document.getElementById('partnerNameDiv');
  if (data.selfName && data.partnerName) {
    partnerDiv.innerText = `Вы: ${data.selfName}\nПартнёр: ${data.partnerName}\nПарочка готова! 💖`;
  } else if (data.selfName) {
    partnerDiv.innerText = `Вы: ${data.selfName}\nЖдём партнера...`;
  } else {
    partnerDiv.innerText = 'Введите ник, чтобы начать';
  }
});

// Авто-сохранение партнера при вводе
const inputPartner = document.createElement('input');
inputPartner.placeholder = "Ник партнера";
document.body.appendChild(inputPartner);

const btnPartner = document.createElement('button');
btnPartner.innerText = "Сохранить партнера";
document.body.appendChild(btnPartner);

btnPartner.addEventListener('click', () => {
  const partner = inputPartner.value.trim();
  if (!partner) return alert('Введите ник партнера!');
  db.ref('pairs/' + pairCode + '/partnerName').set(partner);
});

</script>

</body>
</html>
