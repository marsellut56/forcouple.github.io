<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swipe Test</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
}

.middle {
  height: 100%;
  overflow: hidden;
}

.wrapper {
  display: flex;
  height: 100%;
  width: 200%; /* КЛЮЧЕВО */
  transition: transform 0.3s ease;
}

.desktop {
  width: 50%; /* 100% / 2 */
  height: 100%;
  flex-shrink: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 32px;
}

.d1 { background: #ffdede; }
.d2 { background: #dedfff; }
</style>
</head>

<body>

<div class="middle">
  <div id="wrapper" class="wrapper">
    <div class="desktop d1">DESKTOP 1</div>
    <div class="desktop d2">DESKTOP 2</div>
  </div>
</div>

<script>
const wrapper = document.getElementById('wrapper');
let current = 0;
let startX = null;

function go(index) {
  current = Math.max(0, Math.min(1, index));
  wrapper.style.transform = `translateX(-${current * 50}%)`;
}

document.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
});

document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - startX;
  if (dx < -60) go(current + 1);
  if (dx >  60) go(current - 1);
});

document.addEventListener('mousedown', e => startX = e.clientX);
document.addEventListener('mouseup', e => {
  const dx = e.clientX - startX;
  if (dx < -60) go(current + 1);
  if (dx >  60) go(current - 1);
});
</script>

</body>
</html>
