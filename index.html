<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini App для парочек</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
body { font-family: sans-serif; padding: 16px; }
button { padding: 10px 16px; margin: 4px; font-size: 16px; }
</style>
</head>
<body>

<div id="screen"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();

// ===== Firebase =====
const firebaseConfig = {
  apiKey: "API_KEY",
  authDomain: "PROJECT_ID.firebaseapp.com",
  databaseURL: "https://PROJECT_ID.firebaseio.com",
  projectId: "PROJECT_ID",
  storageBucket: "PROJECT_ID.appspot.com",
  messagingSenderId: "SENDER_ID",
  appId: "APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ===== Переменные =====
const user = tg.initDataUnsafe.user;
const selfNick = user.username || user.first_name;
const urlParams = new URLSearchParams(window.location.search);
let pairCode = urlParams.get('pair'); // приходит от бота
const screen = document.getElementById('screen');

// ===== Функции экранов =====
function showStartScreen() {
  screen.innerHTML = `
    <h2>Привет, ${selfNick}</h2>
    <button id="createPair">Создать пару</button>
  `;
  document.getElementById('createPair').onclick = createPair;
}

function createPair() {
  pairCode = Math.random().toString(36).substr(2,6);
  db.ref('pairs/' + pairCode).set({
    selfNick: selfNick,
    pairStatus: 'waiting'
  });

  screen.innerHTML = `
    <h2>Ссылка для партнёра</h2>
    <p>Отправьте партнёру ссылку через бота.</p>
    <p>Ожидаем партнёра...</p>
  `;

  // Слушаем статус пары
  db.ref('pairs/' + pairCode).on('value', snapshot => {
    const data = snapshot.val();
    if (!data) return;
    if (data.pairStatus === 'confirmed') showPairScreen(data.selfNick, data.partnerNick);
    if (data.pairStatus === 'cancelled') showStartScreen();
  });

  // Генерируем ссылку на бота
  const botUsername = "YourBotUsername"; // заменить на своего бота
  const link = `https://t.me/${botUsername}?start=${pairCode}`;
  console.log("Ссылка для партнёра:", link);
}

function showJoinScreen() {
  db.ref('pairs/' + pairCode).once('value').then(snapshot => {
    const data = snapshot.val();
    if (!data || data.pairStatus !== 'waiting') {
      alert('Эта пара больше недоступна');
      showStartScreen();
      return;
    }
    screen.innerHTML = `
      <h2>Партнёр: ${data.selfNick}</h2>
      <button id="accept">Да</button>
      <button id="decline">Нет</button>
    `;
    document.getElementById('accept').onclick = () => {
      db.ref('pairs/' + pairCode).update({
        partnerNick: selfNick,
        pairStatus: 'confirmed'
      });
      showPairScreen(data.selfNick, selfNick);
    };
    document.getElementById('decline').onclick = () => {
      db.ref('pairs/' + pairCode).update({ pairStatus: 'cancelled' });
      showStartScreen();
    };
  });
}

function showPairScreen(nick1, nick2) {
  screen.innerHTML = `
    <h2>Парочка готова! 💖</h2>
    <p>${nick1} + ${nick2}</p>
  `;
}

// ===== Начало =====
if (pairCode) {
  // Пришёл по ссылке от бота
  showJoinScreen();
} else {
  // Новый пользователь
  showStartScreen();
}
</script>
</body>
</html>
