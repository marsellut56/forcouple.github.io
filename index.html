<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini App для парочек</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
body { font-family: sans-serif; padding: 16px; position: relative; }
input, button { padding: 8px; font-size: 16px; margin: 4px 0; width: 100%; }
#breakPair { 
  position: absolute; 
  top: 16px; 
  right: 16px; 
  padding: 6px 10px; 
  font-size: 14px; 
  background: #ff4d4f; 
  color: white; 
  border: none; 
  border-radius: 4px;
  cursor: pointer;
}
</style>
</head>
<body>

<div id="screen"></div>
<button id="breakPair" style="display:none;">Разорвать пару</button>

<script>
const tg = window.Telegram.WebApp;
tg.ready();

// ===== Firebase =====
const firebaseConfig = {
  apiKey: "AIzaSyCXxIQD1aNxBvauiY65MMNWuwuXQYeKUn8",
  authDomain: "mini-app-forcouples.firebaseapp.com",
  databaseURL: "https://mini-app-forcouples-default-rtdb.firebaseio.com",
  projectId: "mini-app-forcouples",
  storageBucket: "mini-app-forcouples.firebasestorage.app",
  messagingSenderId: "597378655994",
  appId: "1:597378655994:web:82c08f4e0a81a6894ecb43",
  measurementId: "G-6DM9GWM2QR"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ===== Переменные =====
const user = tg.initDataUnsafe.user;
const selfNick = user.username || user.first_name;
const screen = document.getElementById('screen');
const breakBtn = document.getElementById('breakPair');

// ===== Функции =====

// Проверка, есть ли взаимная пара
function checkPair() {
  screen.innerHTML = `<p>Загрузка... ⏳</p>`;
  breakBtn.style.display = 'none';

  db.ref('pairs/' + selfNick).once('value').then(s => {
    const myData = s.val();
    if (!myData || !myData.partner) {
      showStartScreen();
      return;
    }

    const partnerNick = myData.partner;
    db.ref('pairs/' + partnerNick).once('value').then(s2 => {
      const partnerData = s2.val();
      if (partnerData && partnerData.partner === selfNick) {
        showPairScreen(selfNick, partnerNick);
      } else {
        showBrokenScreen();
      }
    });
  });
}

// Стартовый экран для ввода партнёра
function showStartScreen() {
  breakBtn.style.display = 'none';
  screen.innerHTML = `
    <h2>Привет, ${selfNick}</h2>
    <p>Введите ник вашего партнёра:</p>
    <input id="partnerInput" placeholder="Ник партнёра">
    <button id="savePartner">Подтвердить</button>
  `;

  document.getElementById('savePartner').onclick = () => {
    const partnerNick = document.getElementById('partnerInput').value.trim();
    if (!partnerNick) return alert("Введите ник партнёра!");
    db.ref('pairs/' + selfNick).set({ partner: partnerNick });
    checkPair();
  };
}

// Экран пары
function showPairScreen(nick1, nick2) {
  breakBtn.style.display = 'block';
  screen.innerHTML = `
    <h2>Парочка готова! 💖</h2>
    <p>${nick1} + ${nick2}</p>
  `;
}

// Экран разорванной пары
function showBrokenScreen() {
  breakBtn.style.display = 'none';
  screen.innerHTML = `
    <h2>Пара разорвана 😢</h2>
    <button id="newLife">Жить новую жизнь</button>
  `;
  document.getElementById('newLife').onclick = () => {
    db.ref('pairs/' + selfNick).remove();
    showStartScreen();
  };
}

// Разрыв пары пользователем
breakBtn.onclick = () => {
  db.ref('pairs/' + selfNick).remove();
  showBrokenScreen();
}

// ===== Старт =====
checkPair();
</script>
</body>
</html>
